name: Dispatch Temporary Oculus Shader Test

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.issue.pull_request && github.event.comment.body == '/run-oculus-shader-test'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch shader workflow and report run ID
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          before=$(date -u +%s)
          gh workflow run test-oculus-real-shaders.yml --repo "$GITHUB_REPOSITORY" --ref 1.16.X-dev
          run_id=""
          for attempt in $(seq 1 60); do
            candidate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test-oculus-real-shaders.yml --event workflow_dispatch --limit 1 --json databaseId,createdAt --jq '.[0] | [.databaseId, .createdAt] | @tsv' 2>/dev/null || true)
            if [ -n "$candidate" ]; then
              candidate_id=$(printf '%s' "$candidate" | cut -f1)
              candidate_time=$(printf '%s' "$candidate" | cut -f2)
              candidate_epoch=$(date -u -d "$candidate_time" +%s 2>/dev/null || echo 0)
              if [ "$candidate_epoch" -ge "$before" ]; then
                run_id="$candidate_id"
                break
              fi
            fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body 'OCULUS_SHADER_DISPATCH_FAILED'
            exit 1
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "OCULUS_SHADER_DISPATCHED_RUN_ID=$run_id"
