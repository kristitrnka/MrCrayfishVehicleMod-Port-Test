name: Temporary Fetch Sildurs 2.01

on:
  pull_request:
    branches: [1.16.X-dev]
    types: [opened, reopened, synchronize]

jobs:
  fetch-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Locate and download official Sildurs Vibrant 2.01 Extreme
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sildurs"
          python3 - <<'PY'
          import json, pathlib, urllib.parse, urllib.request, zipfile

          out = pathlib.Path(__import__('os').environ['RUNNER_TEMP']) / 'sildurs'
          headers = {'User-Agent': 'Oculus shader compatibility validation/1.0'}

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=120) as response:
                  return json.load(response)

          query = urllib.parse.quote("Sildur's Vibrant Shaders")
          search = get_json('https://api.modrinth.com/v2/search?query=' + query + '&limit=100')
          (out / 'search.json').write_text(json.dumps(search, indent=2))
          hits = search.get('hits', [])
          candidates = [h for h in hits if 'sildur' in h.get('title','').lower() and 'vibrant' in h.get('title','').lower()]
          if not candidates:
              raise SystemExit('No Sildurs Vibrant project found. Titles: ' + repr([h.get('title') for h in hits[:20]]))
          project = candidates[0]
          versions = get_json('https://api.modrinth.com/v2/project/' + project['project_id'] + '/version')
          (out / 'versions.json').write_text(json.dumps(versions, indent=2))

          choices = []
          for version in versions:
              text = ' '.join([version.get('name',''), version.get('version_number','')]).lower()
              for file in version.get('files', []):
                  filename = file.get('filename','')
                  lower = filename.lower()
                  score = 0
                  if '2.01' in text or '2.01' in lower: score += 100
                  if 'extreme' in lower and 'volumetric' not in lower: score += 50
                  if lower.endswith('.zip'): score += 10
                  if score:
                      choices.append((score, version, file))
          if not choices:
              raise SystemExit('No v2.01 Extreme file found')
          choices.sort(key=lambda item: item[0], reverse=True)
          score, version, file = choices[0]
          metadata = {'project': project, 'version': version, 'file': file, 'score': score}
          (out / 'selected.json').write_text(json.dumps(metadata, indent=2))
          pack_path = out / file['filename']
          req = urllib.request.Request(file['url'], headers=headers)
          with urllib.request.urlopen(req, timeout=180) as response, pack_path.open('wb') as target:
              target.write(response.read())
          with zipfile.ZipFile(pack_path) as archive:
              archive.extractall(out / 'unpacked')
              names = archive.namelist()
          (out / 'file-list.txt').write_text('\n'.join(names) + '\n')

          deferred = list((out / 'unpacked').rglob('deferred.vsh'))
          if not deferred:
              raise SystemExit('deferred.vsh not found in ' + file['filename'])
          source = deferred[0].read_text(errors='replace')
          (out / 'deferred.vsh').write_text(source)
          print('Selected:', file['filename'])
          print('Deferred:', deferred[0])
          print(source[:2000])
          PY

      - name: Upload pack and source
        uses: actions/upload-artifact@v4
        with:
          name: sildurs-v201-extreme-source
          path: ${{ runner.temp }}/sildurs
          retention-days: 1
