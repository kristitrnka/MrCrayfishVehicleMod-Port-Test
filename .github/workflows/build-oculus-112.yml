name: Temporary Oculus 1.12.2 Build

on:
  push:
    branches:
      - automation/build-oculus-112
  pull_request:
    branches:
      - 1.16.X-dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Oculus source
        run: git clone --depth 1 --branch 1.12.2-dev https://github.com/dabrelity1/Oculus.git "$RUNNER_TEMP/Oculus"

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build Oculus 1.12.2
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain build --stacktrace > build-output.log 2>&1
          status=$?
          echo '========== GRADLE OUTPUT TAIL =========='
          tail -n 200 build-output.log
          exit $status

      - name: List build outputs
        if: always()
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: find build -maxdepth 4 -type f -printf '%p %s bytes\n' 2>/dev/null || true

      - name: Upload Oculus jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-dev
          path: ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/*.jar
          if-no-files-found: error
          retention-days: 1
