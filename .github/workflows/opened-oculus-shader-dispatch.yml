name: New PR Oculus Shader Dispatch

on:
  pull_request_target:
    types: [opened]

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: startsWith(github.event.pull_request.head.ref, 'automation/oculus-shader-v2-trigger')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V2 shader validation
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "OCULUS_SHADER_OPENED_TRIGGER_RUN_ID=${{ github.run_id }}"
          before=$(date -u +%s)
          gh workflow run oculus-shader-validation-v2.yml --repo "$GITHUB_REPOSITORY" --ref 1.16.X-dev
          run_id=""
          for attempt in $(seq 1 60); do
            candidate=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow oculus-shader-validation-v2.yml --event workflow_dispatch --limit 1 --json databaseId,createdAt --jq '.[0] | [.databaseId, .createdAt] | @tsv' 2>/dev/null || true)
            if [ -n "$candidate" ]; then
              candidate_id=$(printf '%s' "$candidate" | cut -f1)
              candidate_time=$(printf '%s' "$candidate" | cut -f2)
              candidate_epoch=$(date -u -d "$candidate_time" +%s 2>/dev/null || echo 0)
              if [ "$candidate_epoch" -ge "$before" ]; then
                run_id="$candidate_id"
                break
              fi
            fi
            sleep 2
          done
          test -n "$run_id"
          gh issue comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "OCULUS_SHADER_OPENED_V2_RUN_ID=$run_id"
