name: Temporary Oculus 1.12.2 Real Forge Test

on:
  push:
    branches: [automation/build-oculus-112]
  pull_request:
    branches: [1.16.X-dev]
  workflow_dispatch:

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone and patch Oculus
        run: |
          git clone --depth 1 --branch 1.12.2-dev https://github.com/dabrelity1/Oculus.git "$RUNNER_TEMP/Oculus"
          cd "$RUNNER_TEMP/Oculus/oculus-1.12.2"
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('build.gradle')
          text = gradle.read_text()
          text = text.replace(
              'def outRefmapFile = file("${buildDir}/resources/main/oculus.refmap.json")',
              'def outRefmapFile = file("${buildDir}/generated/mixins/oculus.refmap.json")'
          )
          marker = '''jar {
              manifest {'''
          replacement = '''jar {
              dependsOn compileJava
              from(outRefmapFile) {
                  into ""
              }

              manifest {'''
          if marker not in text:
              raise SystemExit('JAR block marker not found')
          gradle.write_text(text.replace(marker, replacement, 1))

          Path('src/main/java/net/oculus/mixin/pipeline/BlockStateAmbientOcclusionMixin.java').write_text('''package net.oculus.mixin.pipeline;

          import net.minecraft.block.state.BlockStateContainer;
          import net.oculus.pipeline.BlockRenderingSettings;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfoReturnable;

          /** Applies the shader-pack ambientOcclusionLevel directive. */
          @Mixin(value = BlockStateContainer.StateImplementation.class, priority = 990)
          public abstract class BlockStateAmbientOcclusionMixin {
              @Inject(
                  method = {"getAmbientOcclusionLightValue()F", "func_185906_d()F"},
                  at = @At("RETURN"),
                  cancellable = true,
                  remap = false)
              private void oculus$applyAmbientOcclusionLevel(CallbackInfoReturnable<Float> cir) {
                  cir.setReturnValue(BlockRenderingSettings.INSTANCE.applyAmbientOcclusionLevel(cir.getReturnValueF()));
              }
          }
          ''')
          PY

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build reobfuscated Oculus
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build -x test -x compileTestJava > build.log 2>&1
          tail -n 180 build.log
          jar tf build/libs/oculus-0.1.0.jar | grep -E 'oculus.refmap.json|BlockStateAmbientOcclusionMixin.class'
          tar -czf patched-source.tar.gz src/main/java src/main/resources build.gradle

      - name: Install real Forge 1.12.2 profile
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          OCULUS_JAR: ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
        run: |
          python3 -m pip install --quiet minecraft-launcher-lib
          python3 - <<'PY' > "$RUNNER_TEMP/install.log" 2>&1
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import zipfile
          import minecraft_launcher_lib

          def download(url, destination):
              destination = pathlib.Path(destination)
              destination.parent.mkdir(parents=True, exist_ok=True)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 Oculus-1.12.2-production-test',
                  'Accept': '*/*'
              })
              with urllib.request.urlopen(request, timeout=180) as response, destination.open('wb') as output:
                  shutil.copyfileobj(response, output)

          mc = pathlib.Path(os.environ['MC_DIR'])
          mc.mkdir(parents=True, exist_ok=True)
          forge = '1.12.2-14.23.5.2768'
          java = os.path.join(os.environ['JAVA_HOME'], 'bin', 'java')

          print('Installing vanilla 1.12.2')
          minecraft_launcher_lib.install.install_minecraft_version('1.12.2', str(mc))

          installer = mc / 'forge-installer.jar'
          download(
              f'https://maven.minecraftforge.net/net/minecraftforge/forge/{forge}/forge-{forge}-installer.jar',
              installer
          )

          with zipfile.ZipFile(installer) as archive:
              profile = json.loads(archive.read('install_profile.json'))
              print('Forge profile keys:', sorted(profile))
              install = profile['install']
              version_info = profile['versionInfo']
              version_id = install['version']
              print('Forge version id:', version_id)
              print('Forge install metadata:', install)

              version_dir = mc / 'versions' / version_id
              version_dir.mkdir(parents=True, exist_ok=True)
              (version_dir / f'{version_id}.json').write_text(json.dumps(version_info, indent=2))
              shutil.copy2(mc / 'versions/1.12.2/1.12.2.jar', version_dir / f'{version_id}.jar')

              file_path = install['filePath']
              forge_library = mc / 'libraries' / file_path
              forge_library.parent.mkdir(parents=True, exist_ok=True)
              candidates = [
                  'maven/' + file_path,
                  file_path,
                  pathlib.PurePosixPath(file_path).name,
                  f'forge-{forge}-universal.jar'
              ]
              entry = next((name for name in candidates if name in archive.namelist()), None)
              if entry is None:
                  raise RuntimeError('Forge universal JAR not found. Candidates: ' + repr(candidates))
              print('Extracting Forge library:', entry, '->', forge_library)
              with archive.open(entry) as source, forge_library.open('wb') as output:
                  shutil.copyfileobj(source, output)

          print('Installing inherited Forge libraries/assets')
          minecraft_launcher_lib.install.install_minecraft_version(version_id, str(mc))

          mods = mc / 'mods'
          mods.mkdir(exist_ok=True)
          shutil.copy2(os.environ['OCULUS_JAR'], mods / 'oculus-0.1.0-production-test.jar')
          download('https://maven.rongmario.com/zone/rong/mixinbooter/11.5/mixinbooter-11.5.jar', mods / '-mixinbooter-11.5.jar')
          download('https://api.modrinth.com/maven/maven/modrinth/relictium/1.2.0/relictium-1.2.0.jar', mods / 'relictium-1.2.0.jar')

          options = minecraft_launcher_lib.utils.generate_test_options()
          options.update({
              'executablePath': java,
              'defaultExecutablePath': java,
              'gameDirectory': str(mc),
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
              'jvmArguments': ['-Xms512m', '-Xmx3G', '-Duser.language=en']
          })
          command = minecraft_launcher_lib.command.get_minecraft_command(version_id, str(mc), options)
          (mc / 'launch-command.json').write_text(json.dumps(command))
          print('Mods:', sorted(path.name for path in mods.iterdir()))
          print('Launch main class command prepared with', len(command), 'arguments')
          PY
          status=$?
          echo '=== INSTALL LOG ==='
          tail -n 350 "$RUNNER_TEMP/install.log"
          exit "$status"

      - name: Run real obfuscated Forge client
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils mesa-utils
          cat > /tmp/xorg-dummy.conf <<'EOF'
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "AllowMouseOpenFail" "true"
              Option "PciForceNone" "true"
          EndSection
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
                  Virtual 1280 720
              EndSubSection
          EndSection
          EOF
          sudo Xorg :99 -noreset -ac +extension GLX +extension RANDR -config /tmp/xorg-dummy.conf > /tmp/xorg.log 2>&1 &
          xorg_pid=$!
          sleep 4
          export DISPLAY=:99
          xrandr -q
          glxinfo -B || true

          python3 - <<'PY'
          import json, os, pathlib, shlex
          mc = pathlib.Path(os.environ['MC_DIR'])
          command = json.loads((mc / 'launch-command.json').read_text())
          script = '#!/bin/sh\nexec ' + ' '.join(shlex.quote(part) for part in command) + '\n'
          (mc / 'run-production.sh').write_text(script)
          os.chmod(mc / 'run-production.sh', 0o755)
          PY

          set +e
          timeout 240s "$MC_DIR/run-production.sh" > "$MC_DIR/production-runtime.log" 2>&1
          status=$?
          sudo kill "$xorg_pid" 2>/dev/null || true

          echo '=== PRODUCTION RUNTIME LOG ==='
          tail -n 350 "$MC_DIR/production-runtime.log"
          if [ -f "$MC_DIR/logs/latest.log" ]; then
            echo '=== LATEST.LOG ==='
            tail -n 350 "$MC_DIR/logs/latest.log"
          fi

          fatal='Mixin apply.*failed|InvalidInjectionException|InvalidMixinException|MixinTransformerError|Unable to launch|Exception in thread "(main|Client thread)"|A fatal error has been detected'
          if grep -Eqi "$fatal" "$MC_DIR/production-runtime.log" "$MC_DIR/logs/latest.log" 2>/dev/null; then
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo 'Real production client survived the full 240-second test.'
            exit 0
          fi
          exit "$status"

      - name: Upload tested build and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-real-production-test
          path: |
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build.log
            ${{ runner.temp }}/Oculus/oculus-1.12.2/patched-source.tar.gz
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/minecraft-production/production-runtime.log
            ${{ runner.temp }}/minecraft-production/logs/latest.log
            ${{ runner.temp }}/minecraft-production/crash-reports/*.txt
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 1
