name: Temporary Oculus 1.12.2 Production Continuation

on:
  push:
    branches: [automation/build-oculus-112]
  pull_request:
    branches: [1.16.X-dev]
  workflow_dispatch:

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download patched reobfuscated JAR from successful build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/source-artifact"
          gh run download 29324905811 \
            --repo "$GITHUB_REPOSITORY" \
            --name Oculus-1.12.2-real-production-test \
            --dir "$RUNNER_TEMP/source-artifact"
          find "$RUNNER_TEMP/source-artifact" -type f -print
          jar_path=$(find "$RUNNER_TEMP/source-artifact" -name 'oculus-0.1.0.jar' -type f | head -n 1)
          test -n "$jar_path"
          cp "$jar_path" "$RUNNER_TEMP/oculus-0.1.0.jar"
          jar tf "$RUNNER_TEMP/oculus-0.1.0.jar" | grep -E 'oculus.refmap.json|BlockStateAmbientOcclusionMixin.class'

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install real Forge profile and mods
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          OCULUS_JAR: ${{ runner.temp }}/oculus-0.1.0.jar
        run: |
          python3 -m pip install --quiet minecraft-launcher-lib
          python3 - <<'PY' > "$RUNNER_TEMP/install.log" 2>&1
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import zipfile
          import minecraft_launcher_lib

          def download(url, destination):
              destination = pathlib.Path(destination)
              destination.parent.mkdir(parents=True, exist_ok=True)
              print('Downloading:', url)
              request = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 Oculus-1.12.2-production-test',
                  'Accept': '*/*'
              })
              with urllib.request.urlopen(request, timeout=180) as response, destination.open('wb') as output:
                  shutil.copyfileobj(response, output)

          mc = pathlib.Path(os.environ['MC_DIR'])
          mc.mkdir(parents=True, exist_ok=True)
          forge = '1.12.2-14.23.5.2768'
          java = os.path.join(os.environ['JAVA_HOME'], 'bin', 'java')

          minecraft_launcher_lib.install.install_minecraft_version('1.12.2', str(mc))
          installer = mc / 'forge-installer.jar'
          download(
              f'https://maven.minecraftforge.net/net/minecraftforge/forge/{forge}/forge-{forge}-installer.jar',
              installer
          )

          with zipfile.ZipFile(installer) as archive:
              profile = json.loads(archive.read('install_profile.json'))
              install = profile['install']
              version_info = profile['versionInfo']
              version_id = install['version']
              version_dir = mc / 'versions' / version_id
              version_dir.mkdir(parents=True, exist_ok=True)
              (version_dir / f'{version_id}.json').write_text(json.dumps(version_info, indent=2))
              shutil.copy2(mc / 'versions/1.12.2/1.12.2.jar', version_dir / f'{version_id}.jar')

              coordinate_path = pathlib.Path(*install['path'].split(':')[:1])
              group, artifact, version = install['path'].split(':')[:3]
              forge_library = mc / 'libraries' / pathlib.Path(*group.split('.')) / artifact / version / f'{artifact}-{version}-universal.jar'
              forge_library.parent.mkdir(parents=True, exist_ok=True)
              candidates = [
                  install['filePath'],
                  'maven/' + install['filePath'],
                  f'forge-{forge}-universal.jar'
              ]
              entry = next((candidate for candidate in candidates if candidate in archive.namelist()), None)
              if entry is None:
                  raise RuntimeError('Forge universal JAR missing: ' + repr(candidates))
              print('Extracting', entry, 'to', forge_library)
              with archive.open(entry) as source, forge_library.open('wb') as output:
                  shutil.copyfileobj(source, output)

          minecraft_launcher_lib.install.install_minecraft_version(version_id, str(mc))

          mods = mc / 'mods'
          mods.mkdir(exist_ok=True)
          shutil.copy2(os.environ['OCULUS_JAR'], mods / 'oculus-0.1.0-production-test.jar')
          download(
              'https://repo.cleanroommc.com/releases/zone/rong/mixinbooter/11.5/mixinbooter-11.5.jar',
              mods / '-mixinbooter-11.5.jar'
          )
          download(
              'https://api.modrinth.com/maven/maven/modrinth/relictium/1.2.0/relictium-1.2.0.jar',
              mods / 'relictium-1.2.0.jar'
          )

          options = minecraft_launcher_lib.utils.generate_test_options()
          options.update({
              'executablePath': java,
              'defaultExecutablePath': java,
              'gameDirectory': str(mc),
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
              'jvmArguments': ['-Xms512m', '-Xmx3G', '-Duser.language=en']
          })
          command = minecraft_launcher_lib.command.get_minecraft_command(version_id, str(mc), options)
          (mc / 'launch-command.json').write_text(json.dumps(command))
          print('Version:', version_id)
          print('Mods:', sorted(path.name for path in mods.iterdir()))
          PY
          status=$?
          echo '=== INSTALL LOG ==='
          tail -n 350 "$RUNNER_TEMP/install.log"
          exit "$status"

      - name: Run real obfuscated Forge client
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils mesa-utils
          cat > /tmp/xorg-dummy.conf <<'EOF'
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "AllowMouseOpenFail" "true"
              Option "PciForceNone" "true"
          EndSection
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
                  Virtual 1280 720
              EndSubSection
          EndSection
          EOF
          sudo Xorg :99 -noreset -ac +extension GLX +extension RANDR -config /tmp/xorg-dummy.conf > /tmp/xorg.log 2>&1 &
          xorg_pid=$!
          sleep 4
          export DISPLAY=:99
          xrandr -q
          glxinfo -B || true

          python3 - <<'PY'
          import json, os, pathlib, shlex
          mc = pathlib.Path(os.environ['MC_DIR'])
          command = json.loads((mc / 'launch-command.json').read_text())
          (mc / 'run-production.sh').write_text(
              '#!/bin/sh\nexec ' + ' '.join(shlex.quote(part) for part in command) + '\n'
          )
          os.chmod(mc / 'run-production.sh', 0o755)
          PY

          set +e
          timeout 240s "$MC_DIR/run-production.sh" > "$MC_DIR/production-runtime.log" 2>&1
          status=$?
          sudo kill "$xorg_pid" 2>/dev/null || true

          echo '=== PRODUCTION RUNTIME LOG ==='
          tail -n 400 "$MC_DIR/production-runtime.log"
          if [ -f "$MC_DIR/logs/latest.log" ]; then
            echo '=== LATEST.LOG ==='
            tail -n 400 "$MC_DIR/logs/latest.log"
          fi

          fatal='Mixin apply.*failed|InvalidInjectionException|InvalidMixinException|MixinTransformerError|Unable to launch|Exception in thread "(main|Client thread)"|A fatal error has been detected'
          if grep -Eqi "$fatal" "$MC_DIR/production-runtime.log" "$MC_DIR/logs/latest.log" 2>/dev/null; then
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo 'Real production client survived the complete 240-second test.'
            exit 0
          fi
          exit "$status"

      - name: Upload tested JAR and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-production-continuation
          path: |
            ${{ runner.temp }}/oculus-0.1.0.jar
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/minecraft-production/production-runtime.log
            ${{ runner.temp }}/minecraft-production/logs/latest.log
            ${{ runner.temp }}/minecraft-production/crash-reports/*.txt
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 1
