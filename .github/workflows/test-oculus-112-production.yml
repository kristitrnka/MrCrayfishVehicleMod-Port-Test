name: Temporary Oculus 1.12.2 Production Runtime Test

on:
  push:
    branches:
      - automation/build-oculus-112
  pull_request:
    branches:
      - 1.16.X-dev
  workflow_dispatch:

jobs:
  production-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone Oculus
        run: git clone --depth 1 --branch 1.12.2-dev https://github.com/dabrelity1/Oculus.git "$RUNNER_TEMP/Oculus"

      - name: Patch Oculus production mappings
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('build.gradle')
          text = gradle.read_text()
          text = text.replace(
              'def outRefmapFile = file("${buildDir}/resources/main/oculus.refmap.json")',
              'def outRefmapFile = file("${buildDir}/generated/mixins/oculus.refmap.json")'
          )
          old = '''jar {
              manifest {'''
          new = '''jar {
              dependsOn compileJava
              from(outRefmapFile) {
                  into ""
              }

              manifest {'''
          if old not in text:
              raise SystemExit('jar block marker not found')
          gradle.write_text(text.replace(old, new, 1))

          mixin = Path('src/main/java/net/oculus/mixin/pipeline/BlockStateAmbientOcclusionMixin.java')
          text = mixin.read_text()
          text = text.replace('import net.minecraft.block.Block;\n', '')
          text = text.replace('import org.spongepowered.asm.mixin.Shadow;\n', '')
          text = text.replace('''    @Shadow
              public abstract Block getBlock();

          ''', '')
          text = text.replace(
              'float originalValue = getBlock().getAmbientOcclusionLightValue((IBlockState) (Object) this);',
              'IBlockState state = (IBlockState) (Object) this;\n        float originalValue = state.getBlock().getAmbientOcclusionLightValue(state);'
          )
          mixin.write_text(text)
          PY

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build reobfuscated JAR
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain build -x test -x compileTestJava > build.log 2>&1
          tail -n 150 build.log
          jar tf build/libs/oculus-0.1.0.jar | grep oculus.refmap.json

      - name: Install real Minecraft and Forge
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          OCULUS_JAR: ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
        run: |
          python3 -m pip install --quiet minecraft-launcher-lib
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import shutil
          import urllib.request
          import minecraft_launcher_lib

          mc = pathlib.Path(os.environ['MC_DIR'])
          mc.mkdir(parents=True, exist_ok=True)
          forge = '1.12.2-14.23.5.2768'
          minecraft_launcher_lib.forge.install_forge_version(forge, str(mc), java=os.path.join(os.environ['JAVA_HOME'], 'bin', 'java'))

          mods = mc / 'mods'
          mods.mkdir(exist_ok=True)
          shutil.copy2(os.environ['OCULUS_JAR'], mods / 'oculus-0.1.0-production-test.jar')

          downloads = {
              'mixinbooter-11.5.jar': 'https://maven.rongmario.com/zone/rong/mixinbooter/11.5/mixinbooter-11.5.jar',
              'relictium-1.2.0.jar': 'https://api.modrinth.com/maven/maven/modrinth/relictium/1.2.0/relictium-1.2.0.jar',
          }
          for name, url in downloads.items():
              print('Downloading', url)
              urllib.request.urlretrieve(url, mods / name)

          version = minecraft_launcher_lib.forge.forge_to_installed_version(forge)
          options = minecraft_launcher_lib.utils.generate_test_options()
          options.update({
              'executablePath': os.path.join(os.environ['JAVA_HOME'], 'bin', 'java'),
              'defaultExecutablePath': os.path.join(os.environ['JAVA_HOME'], 'bin', 'java'),
              'gameDirectory': str(mc),
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
              'jvmArguments': ['-Xms512m', '-Xmx3G', '-Duser.language=en'],
          })
          command = minecraft_launcher_lib.command.get_minecraft_command(version, str(mc), options)
          (mc / 'launch-command.json').write_text(json.dumps(command))
          print('Installed version:', version)
          print('Mods:', [p.name for p in mods.iterdir()])
          PY

      - name: Run real obfuscated Forge client
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-production
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils mesa-utils
          cat > /tmp/xorg-dummy.conf <<'EOF'
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "AllowMouseOpenFail" "true"
              Option "PciForceNone" "true"
          EndSection
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
                  Virtual 1280 720
              EndSubSection
          EndSection
          EOF
          sudo Xorg :99 -noreset -ac +extension GLX +extension RANDR -config /tmp/xorg-dummy.conf > /tmp/xorg.log 2>&1 &
          xorg_pid=$!
          sleep 4
          export DISPLAY=:99
          xrandr -q
          glxinfo -B || true

          python3 - <<'PY'
          import json, os, pathlib, shlex
          mc = pathlib.Path(os.environ['MC_DIR'])
          command = json.loads((mc / 'launch-command.json').read_text())
          (mc / 'run-production.sh').write_text('#!/bin/sh\nexec ' + ' '.join(shlex.quote(x) for x in command) + '\n')
          os.chmod(mc / 'run-production.sh', 0o755)
          PY

          set +e
          timeout 240s "$MC_DIR/run-production.sh" > "$MC_DIR/production-runtime.log" 2>&1
          status=$?
          sudo kill "$xorg_pid" 2>/dev/null || true

          echo '=== PRODUCTION RUNTIME LOG TAIL ==='
          tail -n 300 "$MC_DIR/production-runtime.log"
          if [ -f "$MC_DIR/logs/latest.log" ]; then
            echo '=== LATEST.LOG TAIL ==='
            tail -n 300 "$MC_DIR/logs/latest.log"
          fi

          if grep -Eqi 'Mixin apply.*failed|InvalidInjectionException|InvalidMixinException|MixinTransformerError|Unable to launch|Exception in thread "(main|Client thread)"|A fatal error has been detected' "$MC_DIR/production-runtime.log" "$MC_DIR/logs/latest.log" 2>/dev/null; then
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo 'Production client remained alive until timeout.'
            exit 0
          fi
          exit "$status"

      - name: Upload production-tested JAR and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-production-runtime
          path: |
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build.log
            ${{ runner.temp }}/minecraft-production/production-runtime.log
            ${{ runner.temp }}/minecraft-production/logs/latest.log
            ${{ runner.temp }}/minecraft-production/crash-reports/*.txt
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 1
