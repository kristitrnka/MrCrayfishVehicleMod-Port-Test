name: Oculus Real Shader PR Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [1.16.X-dev]

permissions:
  actions: read
  contents: write

jobs:
  shader-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Run production Minecraft shader validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/kristitrnka/MrCrayfishVehicleMod-Port-Test/10c19389be657a3f5a24f5339b820b55d861bd2b/.github/scripts/oculus-real-shader-test.sh' -o /tmp/oculus-real-shader-test.sh
          chmod +x /tmp/oculus-real-shader-test.sh
          /tmp/oculus-real-shader-test.sh
