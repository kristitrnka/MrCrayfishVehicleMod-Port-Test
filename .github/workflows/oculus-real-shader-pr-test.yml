name: Oculus Real Shader PR Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [1.16.X-dev]

permissions:
  actions: read
  contents: write

jobs:
  shader-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Run production Minecraft shader validation
        id: validation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/kristitrnka/MrCrayfishVehicleMod-Port-Test/10c19389be657a3f5a24f5339b820b55d861bd2b/.github/scripts/oculus-real-shader-test.sh' -o /tmp/oculus-real-shader-test.sh
          chmod +x /tmp/oculus-real-shader-test.sh
          set +e
          /tmp/oculus-real-shader-test.sh > "$RUNNER_TEMP/oculus-validation-full.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/oculus-validation-exit-code.txt"
          echo '=== VALIDATION LOG TAIL ==='
          tail -n 180 "$RUNNER_TEMP/oculus-validation-full.log"
          exit "$status"

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-real-shader-validation-diagnostics
          path: |
            ${{ runner.temp }}/oculus-validation-full.log
            ${{ runner.temp }}/oculus-validation-exit-code.txt
            ${{ runner.temp }}/oculus-validation-results/**
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build.log
            ${{ runner.temp }}/minecraft-shader-test/shader-runtime.log
            ${{ runner.temp }}/minecraft-shader-test/logs/latest.log
            ${{ runner.temp }}/minecraft-shader-test/screenshots/*.png
            ${{ runner.temp }}/vanilla-server/server.log
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 2

      - name: Enforce validation result
        if: always()
        run: test '${{ steps.validation.outcome }}' = 'success'
