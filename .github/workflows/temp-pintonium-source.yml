name: Temporary Pintonium Source Export

on:
  push:
    branches:
      - temp-pintonium-import-20260715
  pull_request:
    branches:
      - 1.16.X-dev
  workflow_dispatch:

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Pintonium
        run: git clone --depth 1 https://github.com/Xplodin/Pintonium.git pintonium
      - name: Archive source
        run: |
          rm -rf pintonium/.git
          tar -czf Pintonium-source.tar.gz pintonium
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: pintonium-source-only
          path: Pintonium-source.tar.gz
          if-no-files-found: error
