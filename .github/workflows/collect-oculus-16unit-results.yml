name: Collect Temporary Oculus 16-Unit Results

on:
  workflow_run:
    workflows: ['Temporary Oculus 16 Texture Unit Test']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: 1.16.X-dev

      - name: Download validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -e
          mkdir -p .github/oculus-16unit-results
          printf 'run_id=%s\nconclusion=%s\n' "$RUN_ID" "$CONCLUSION" > .github/oculus-16unit-results/status.txt
          python3 - <<'PY'
          import json, os, pathlib, urllib.request, zipfile, io
          repo = os.environ['REPOSITORY']
          run_id = os.environ['RUN_ID']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Oculus validation collector'
          }
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts',
              headers=headers)
          with urllib.request.urlopen(request) as response:
              payload = json.load(response)
          artifacts = payload.get('artifacts', [])
          if not artifacts:
              pathlib.Path('.github/oculus-16unit-results/no-artifact.txt').write_text('No workflow artifact was produced.\n')
              raise SystemExit(0)
          artifact = next((item for item in artifacts if item['name'] == 'Oculus-1.12.2-apple-16unit-fixed'), artifacts[0])
          request = urllib.request.Request(artifact['archive_download_url'], headers=headers)
          with urllib.request.urlopen(request) as response:
              data = response.read()
          target = pathlib.Path('.github/oculus-16unit-results')
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              archive.extractall(target)
          PY

      - name: Normalize useful result files
        run: |
          set -e
          result=.github/oculus-16unit-results
          jar_path=$(find "$result" -type f -name 'oculus-0.1.0.jar' | head -n 1 || true)
          if [ -n "$jar_path" ]; then
            cp "$jar_path" "$result/oculus-0.1.0-apple-16unit-fixed.jar"
            sha256sum "$result/oculus-0.1.0-apple-16unit-fixed.jar" > "$result/sha256.txt"
          fi
          image_path=$(find "$result" -type f -name 'center-depth-16unit.png' | head -n 1 || true)
          if [ -n "$image_path" ] && [ "$image_path" != "$result/center-depth-16unit.png" ]; then
            cp "$image_path" "$result/center-depth-16unit.png"
          fi
          log_path=$(find "$result" -type f -name 'latest.log' | head -n 1 || true)
          if [ -n "$log_path" ] && [ "$log_path" != "$result/latest.log" ]; then
            cp "$log_path" "$result/latest.log"
          fi

      - name: Commit collected results
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/oculus-16unit-results
          git commit -m "ci: collect Oculus 16-unit result $RUN_ID" || exit 0
          git push origin HEAD:1.16.X-dev
