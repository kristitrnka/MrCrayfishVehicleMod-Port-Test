name: Temporary Oculus Real Shader Test

on:
  push:
    branches: [1.16.X-dev]
  workflow_dispatch:

concurrency:
  group: oculus-real-shader-validation
  cancel-in-progress: true

permissions:
  actions: read
  contents: write

jobs:
  shader-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out validation repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build and render a real shader world
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/oculus-real-shader-test.sh
