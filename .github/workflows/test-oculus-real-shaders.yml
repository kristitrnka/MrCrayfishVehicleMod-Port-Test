name: Temporary Oculus Real Shader Test

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [1.16.X-dev]
  workflow_dispatch:

jobs:
  shader-world:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read

    steps:
      - name: Restore startup-fixed Oculus source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 --branch 1.12.2-dev https://github.com/dabrelity1/Oculus.git "$RUNNER_TEMP/Oculus"
          gh run download 29326417270 --repo "$GITHUB_REPOSITORY" \
            --name Oculus-1.12.2-production-continuation --dir "$RUNNER_TEMP/previous"
          source_archive=$(find "$RUNNER_TEMP/previous" -name patched-source.tar.gz -type f | head -n 1)
          test -n "$source_archive"
          tar -xzf "$source_archive" -C "$RUNNER_TEMP/Oculus/oculus-1.12.2"

      - name: Apply world-load fix and embed runtime shader preprocessor
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mixin = Path('src/main/java/net/oculus/mixin/pipeline/ChunkOneshotGraphicsStateMixin.java')
          text = mixin.read_text()
          old = 'private void oculus$captureVertexFormat(CommandList commandList, ChunkMeshData meshData, CallbackInfo ci, VertexData vertexData, GlVertexFormat<ChunkMeshAttribute> vertexFormat, TessellationBinding[] bindings, GlMutableBuffer vertexBuffer)'
          new = 'private void oculus$captureVertexFormat(CommandList commandList, ChunkMeshData meshData, CallbackInfo ci, VertexData vertexData, GlVertexFormat<ChunkMeshAttribute> vertexFormat)'
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace('import me.jellysquid.mods.sodium.client.gl.buffer.GlMutableBuffer;\n', '')
              mixin.write_text(text)
          elif new not in text:
              raise SystemExit('Unexpected ChunkOneshot callback signature')

          build = Path('build.gradle')
          gradle = build.read_text()
          if 'configurations { oculusEmbed }' not in gradle:
              marker = 'dependencies {\n'
              gradle = gradle.replace(marker, 'configurations { oculusEmbed }\n\n' + marker, 1)
              dep_marker = '    testCompile "junit:junit:4.13.2"\n'
              gradle = gradle.replace(dep_marker, dep_marker + '''    oculusEmbed("org.anarres:jcpp:1.4.14") { transitive = false }\n    oculusEmbed("org.slf4j:slf4j-api:1.7.12") { transitive = false }\n''', 1)
              jar_marker = 'jar {\n'
              gradle = gradle.replace(jar_marker, '''jar {\n    duplicatesStrategy = DuplicatesStrategy.EXCLUDE\n    from { configurations.oculusEmbed.collect { zipTree(it) } }\n    exclude "META-INF/*.SF", "META-INF/*.RSA", "META-INF/*.DSA"\n''', 1)
              build.write_text(gradle)
          PY

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build fat production JAR
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          chmod +x gradlew
          status=1
          for attempt in 1 2 3; do
            ./gradlew --no-daemon --console=plain build -x test -x compileTestJava > build.log 2>&1
            status=$?
            tail -n 260 build.log
            if [ "$status" -eq 0 ]; then break; fi
            sleep 10
          done
          test "$status" -eq 0
          jar tf build/libs/oculus-0.1.0.jar | grep 'org/anarres/cpp/PreprocessorListener.class'
          jar tf build/libs/oculus-0.1.0.jar | grep 'org/slf4j/Logger.class'
          tar -czf patched-source.tar.gz src/main/java src/main/resources build.gradle

      - name: Assemble obfuscated Forge client and local server
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-shader-test
          SERVER_DIR: ${{ runner.temp }}/vanilla-server
          OCULUS_JAR: ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
        run: |
          python3 -m pip install --quiet minecraft-launcher-lib
          python3 - <<'PY' > "$RUNNER_TEMP/install.log" 2>&1
          import json, os, pathlib, shutil, urllib.request, zipfile
          import minecraft_launcher_lib

          def download(url, path):
              path = pathlib.Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(url, headers={'User-Agent': 'Oculus shader validation'})
              with urllib.request.urlopen(req, timeout=180) as r, path.open('wb') as out:
                  shutil.copyfileobj(r, out)

          mc = pathlib.Path(os.environ['MC_DIR'])
          server = pathlib.Path(os.environ['SERVER_DIR'])
          mc.mkdir(parents=True, exist_ok=True)
          server.mkdir(parents=True, exist_ok=True)
          java = os.path.join(os.environ['JAVA_HOME'], 'bin', 'java')
          forge = '1.12.2-14.23.5.2768'

          minecraft_launcher_lib.install.install_minecraft_version('1.12.2', str(mc))
          installer = mc / 'forge-installer.jar'
          download(f'https://maven.minecraftforge.net/net/minecraftforge/forge/{forge}/forge-{forge}-installer.jar', installer)
          with zipfile.ZipFile(installer) as archive:
              info = json.loads(archive.read('install_profile.json'))['versionInfo']
              version_id = info['id']
              version_dir = mc / 'versions' / version_id
              version_dir.mkdir(parents=True, exist_ok=True)
              (version_dir / f'{version_id}.json').write_text(json.dumps(info, indent=2))
              shutil.copy2(mc / 'versions/1.12.2/1.12.2.jar', version_dir / f'{version_id}.jar')
              forge_jar = mc / 'libraries/net/minecraftforge/forge' / forge / f'forge-{forge}.jar'
              forge_jar.parent.mkdir(parents=True, exist_ok=True)
              with archive.open(f'forge-{forge}-universal.jar') as src, forge_jar.open('wb') as dst:
                  shutil.copyfileobj(src, dst)
          minecraft_launcher_lib.install.install_minecraft_version(version_id, str(mc))

          mods = mc / 'mods'
          mods.mkdir(exist_ok=True)
          shutil.copy2(os.environ['OCULUS_JAR'], mods / 'oculus-0.1.0-shader-tested.jar')
          download('https://repo.cleanroommc.com/releases/zone/rong/mixinbooter/11.5/mixinbooter-11.5.jar', mods / '-mixinbooter-11.5.jar')
          download('https://api.modrinth.com/maven/maven/modrinth/relictium/1.2.0/relictium-1.2.0.jar', mods / 'relictium-1.2.0.jar')

          pack = mc / 'shaderpacks' / 'OculusValidation' / 'shaders'
          pack.mkdir(parents=True, exist_ok=True)
          vertex = '''#version 120
varying vec2 texcoord;
varying vec2 lmcoord;
varying vec4 vcolor;
void main() {
    gl_Position = ftransform();
    texcoord = (gl_TextureMatrix[0] * gl_MultiTexCoord0).xy;
    lmcoord = (gl_TextureMatrix[1] * gl_MultiTexCoord1).xy;
    vcolor = gl_Color;
}
'''
          fragment = '''#version 120
uniform sampler2D texture;
uniform sampler2D lightmap;
varying vec2 texcoord;
varying vec2 lmcoord;
varying vec4 vcolor;
/* DRAWBUFFERS:0 */
void main() {
    vec4 base = texture2D(texture, texcoord) * vcolor;
    vec3 light = texture2D(lightmap, lmcoord).rgb;
    gl_FragData[0] = vec4(base.rgb * max(light, vec3(0.18)), base.a);
}
'''
          basic_fragment = '''#version 120
varying vec4 vcolor;
/* DRAWBUFFERS:0 */
void main() { gl_FragData[0] = vcolor; }
'''
          final_vertex = '''#version 120
varying vec2 texcoord;
void main() { gl_Position = ftransform(); texcoord = gl_MultiTexCoord0.xy; }
'''
          final_fragment = '''#version 120
uniform sampler2D colortex0;
varying vec2 texcoord;
void main() {
    vec3 c = texture2D(colortex0, texcoord).rgb;
    gl_FragColor = vec4(c * vec3(1.04, 1.00, 0.96), 1.0);
}
'''
          programs = ['gbuffers_textured', 'gbuffers_textured_lit', 'gbuffers_terrain', 'gbuffers_water', 'gbuffers_entities', 'gbuffers_block', 'gbuffers_hand', 'gbuffers_weather', 'gbuffers_skytextured']
          for name in programs:
              (pack / f'{name}.vsh').write_text(vertex)
              (pack / f'{name}.fsh').write_text(fragment)
          (pack / 'gbuffers_basic.vsh').write_text(vertex)
          (pack / 'gbuffers_basic.fsh').write_text(basic_fragment)
          (pack / 'final.vsh').write_text(final_vertex)
          (pack / 'final.fsh').write_text(final_fragment)
          (pack / 'shaders.properties').write_text('oldLighting=true\n')
          (mc / 'oculus.properties').write_text(
              'selectedPackName=OculusValidation\n'
              'shaderPack=OculusValidation\n'
              'shadersEnabled=true\n'
              'enableShaders=true\n'
          )

          options = minecraft_launcher_lib.utils.generate_test_options()
          options.update({
              'username': 'OculusShaderTest',
              'uuid': '00000000-0000-0000-0000-000000000002',
              'token': '0',
              'executablePath': java,
              'defaultExecutablePath': java,
              'gameDirectory': str(mc),
              'customResolution': True,
              'resolutionWidth': '1280',
              'resolutionHeight': '720',
              'jvmArguments': ['-Xms512m', '-Xmx3G', '-Duser.language=en']
          })
          command = minecraft_launcher_lib.command.get_minecraft_command(version_id, str(mc), options)
          command.extend(['--server', '127.0.0.1', '--port', '25565'])
          (mc / 'launch-command.json').write_text(json.dumps(command))

          manifest = json.loads(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json').read())
          version_url = next(v['url'] for v in manifest['versions'] if v['id'] == '1.12.2')
          version_json = json.loads(urllib.request.urlopen(version_url).read())
          download(version_json['downloads']['server']['url'], server / 'server.jar')
          (server / 'eula.txt').write_text('eula=true\n')
          (server / 'server.properties').write_text('online-mode=false\nserver-port=25565\nview-distance=6\nspawn-protection=0\n')
          print('Ready:', version_id, sorted(p.name for p in mods.iterdir()))
          PY
          status=$?
          tail -n 500 "$RUNNER_TEMP/install.log"
          exit "$status"

      - name: Start local Minecraft server
        env:
          SERVER_DIR: ${{ runner.temp }}/vanilla-server
        run: |
          cd "$SERVER_DIR"
          java -Xms512m -Xmx1G -jar server.jar nogui > server.log 2>&1 &
          echo $! > server.pid
          for attempt in $(seq 1 90); do
            grep -q 'Done (' server.log && exit 0
            kill -0 "$(cat server.pid)" 2>/dev/null || { cat server.log; exit 1; }
            sleep 1
          done
          cat server.log
          exit 1

      - name: Render a real world with active shaders
        env:
          MC_DIR: ${{ runner.temp }}/minecraft-shader-test
          SERVER_DIR: ${{ runner.temp }}/vanilla-server
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils mesa-utils imagemagick
          cat > /tmp/xorg-dummy.conf <<'EOF'
          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection
          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748
          EndSection
          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
                  Virtual 1280 720
              EndSubSection
          EndSection
          EOF
          sudo Xorg :99 -noreset -ac +extension GLX +extension RANDR -config /tmp/xorg-dummy.conf > /tmp/xorg.log 2>&1 &
          xorg_pid=$!
          sleep 4
          export DISPLAY=:99
          glxinfo -B || true

          python3 - <<'PY'
          import json, os, pathlib, shlex
          mc = pathlib.Path(os.environ['MC_DIR'])
          command = json.loads((mc / 'launch-command.json').read_text())
          (mc / 'run.sh').write_text('#!/bin/sh\nexec ' + ' '.join(shlex.quote(x) for x in command) + '\n')
          os.chmod(mc / 'run.sh', 0o755)
          PY

          set +e
          timeout 180s "$MC_DIR/run.sh" > "$MC_DIR/shader-runtime.log" 2>&1 &
          client_pid=$!
          for attempt in $(seq 1 150); do
            if grep -q 'Creating pipeline for dimension minecraft:overworld: ShaderWorldRenderingPipeline' "$MC_DIR/shader-runtime.log" "$MC_DIR/logs/latest.log" 2>/dev/null; then
              sleep 15
              import -display :99 -window root "$MC_DIR/shader-world.png" || true
              break
            fi
            kill -0 "$client_pid" 2>/dev/null || break
            sleep 1
          done
          wait "$client_pid"
          status=$?
          sudo kill "$xorg_pid" 2>/dev/null || true
          kill "$(cat "$SERVER_DIR/server.pid")" 2>/dev/null || true

          echo '=== CLIENT ==='
          tail -n 1200 "$MC_DIR/shader-runtime.log"
          test -f "$MC_DIR/logs/latest.log" && tail -n 1200 "$MC_DIR/logs/latest.log"
          echo '=== SERVER ==='
          tail -n 250 "$SERVER_DIR/server.log"

          fatal='NoClassDefFoundError|ClassNotFoundException: org.anarres|Failed to create shader rendering pipeline|Shader compilation failed|Shader compile log|Game crashed|Unexpected error|MixinTransformerError|InjectionError'
          if grep -Eqi "$fatal" "$MC_DIR/shader-runtime.log" "$MC_DIR/logs/latest.log" 2>/dev/null; then
            exit 1
          fi
          grep -q 'OculusShaderTest.*joined the game' "$SERVER_DIR/server.log"
          grep -q 'Creating pipeline for dimension minecraft:overworld: ShaderWorldRenderingPipeline' "$MC_DIR/shader-runtime.log" "$MC_DIR/logs/latest.log"
          test -s "$MC_DIR/shader-world.png"
          test "$status" -eq 124

      - name: Upload shader-tested build, screenshot, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-real-shader-tested
          path: |
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/oculus-0.1.0.jar
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build.log
            ${{ runner.temp }}/Oculus/oculus-1.12.2/patched-source.tar.gz
            ${{ runner.temp }}/install.log
            ${{ runner.temp }}/minecraft-shader-test/shader-runtime.log
            ${{ runner.temp }}/minecraft-shader-test/logs/latest.log
            ${{ runner.temp }}/minecraft-shader-test/shader-world.png
            ${{ runner.temp }}/minecraft-shader-test/crash-reports/*.txt
            ${{ runner.temp }}/vanilla-server/server.log
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 1
