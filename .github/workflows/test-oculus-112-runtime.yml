name: Temporary Oculus 1.12.2 Runtime Test

on:
  push:
    branches:
      - automation/build-oculus-112
  pull_request:
    branches:
      - 1.16.X-dev
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone Oculus
        run: git clone --depth 1 --branch 1.12.2-dev https://github.com/dabrelity1/Oculus.git "$RUNNER_TEMP/Oculus"

      - name: Patch refmap packaging
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path('build.gradle')
          text = gradle.read_text()
          text = text.replace(
              'def outRefmapFile = file("${buildDir}/resources/main/oculus.refmap.json")',
              'def outRefmapFile = file("${buildDir}/generated/mixins/oculus.refmap.json")'
          )
          old = '''jar {
              manifest {'''
          new = '''jar {
              dependsOn compileJava
              from(outRefmapFile) {
                  into ""
              }

              manifest {'''
          if old not in text:
              raise SystemExit('jar block marker not found')
          text = text.replace(old, new, 1)
          gradle.write_text(text)
          PY

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Build patched Oculus
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --console=plain build -x test -x compileTestJava --stacktrace > build.log 2>&1
          status=$?
          echo '=== BUILD LOG TAIL ==='
          tail -n 250 build.log
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          echo '=== JAR CONTENT CHECK ==='
          jar tf build/libs/oculus-0.1.0.jar | grep -E 'oculus.refmap.json|MinecraftPBRShutdownMixin.class'
          echo '=== REFMAP SHUTDOWN ENTRY ==='
          unzip -p build/libs/oculus-0.1.0.jar oculus.refmap.json | grep -o 'shutdownMinecraftApplet[^,}]*' | head -n 5 || true

      - name: Smoke-test Forge client startup
        working-directory: ${{ runner.temp }}/Oculus/oculus-1.12.2
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xserver-xorg-video-dummy x11-xserver-utils mesa-utils

          cat > /tmp/xorg-dummy.conf <<'EOF'
          Section "ServerFlags"
              Option "DontVTSwitch" "true"
              Option "AllowMouseOpenFail" "true"
              Option "PciForceNone" "true"
          EndSection

          Section "Device"
              Identifier "DummyDevice"
              Driver "dummy"
              VideoRam 256000
          EndSection

          Section "Monitor"
              Identifier "DummyMonitor"
              HorizSync 5.0-1000.0
              VertRefresh 5.0-200.0
              Modeline "1280x720" 74.50 1280 1344 1472 1664 720 723 728 748
          EndSection

          Section "Screen"
              Identifier "DummyScreen"
              Device "DummyDevice"
              Monitor "DummyMonitor"
              DefaultDepth 24
              SubSection "Display"
                  Depth 24
                  Modes "1280x720"
                  Virtual 1280 720
              EndSubSection
          EndSection
          EOF

          sudo Xorg :99 -noreset -ac +extension GLX +extension RANDR -config /tmp/xorg-dummy.conf > /tmp/xorg.log 2>&1 &
          xorg_pid=$!
          sleep 4
          export DISPLAY=:99

          echo '=== XRANDR ==='
          xrandr -q || true
          echo '=== GLX ==='
          glxinfo -B || true

          set +e
          timeout 180s ./gradlew --no-daemon --console=plain runClient > runtime.log 2>&1
          status=$?
          sudo kill "$xorg_pid" 2>/dev/null || true

          echo '=== XORG LOG TAIL ==='
          tail -n 120 /tmp/xorg.log || true
          echo '=== RUNTIME LOG TAIL ==='
          tail -n 250 runtime.log
          if [ -f run/logs/latest.log ]; then
            echo '=== LATEST.LOG TAIL ==='
            tail -n 250 run/logs/latest.log
          fi
          if grep -Eqi 'Mixin apply.*failed|InvalidInjectionException|MixinTransformerError|Unable to launch|Exception in thread "main"|A fatal error has been detected' runtime.log run/logs/latest.log 2>/dev/null; then
            exit 1
          fi
          if [ "$status" -eq 124 ]; then
            echo 'Client remained alive until smoke-test timeout.'
            exit 0
          fi
          exit "$status"

      - name: Upload patched JAR and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Oculus-1.12.2-runtime-test
          path: |
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build/libs/*.jar
            ${{ runner.temp }}/Oculus/oculus-1.12.2/build.log
            ${{ runner.temp }}/Oculus/oculus-1.12.2/runtime.log
            ${{ runner.temp }}/Oculus/oculus-1.12.2/run/logs/latest.log
            ${{ runner.temp }}/Oculus/oculus-1.12.2/run/crash-reports/*.txt
            /tmp/xorg.log
          if-no-files-found: warn
          retention-days: 1
