name: Dispatch Temporary Oculus 16-Unit Test

on:
  push:
    branches: [1.16.X-dev]
    paths:
      - '.github/oculus-16unit-dispatch.txt'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full validation workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/test-oculus-16-texture-units.yml/dispatches" \
            -d '{"ref":"1.16.X-dev"}'
