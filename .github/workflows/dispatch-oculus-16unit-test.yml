name: Dispatch Temporary Oculus 16-Unit Test

on:
  push:
    branches: [1.16.X-dev]
    paths:
      - '.github/oculus-16unit-dispatch.txt'

permissions:
  actions: write
  contents: write

jobs:
  dispatch-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: 1.16.X-dev

      - name: Dispatch full validation and collect result
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPOSITORY"
          auth=(-H 'Accept: application/vnd.github+json' -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28')
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          curl --fail-with-body -sS -L -X POST "${auth[@]}" \
            "$api/actions/workflows/test-oculus-16-texture-units.yml/dispatches" \
            -d '{"ref":"1.16.X-dev"}'

          run_id=''
          for attempt in $(seq 1 60); do
            runs=$(curl --fail-with-body -sS -L "${auth[@]}" \
              "$api/actions/workflows/test-oculus-16-texture-units.yml/runs?event=workflow_dispatch&branch=1.16.X-dev&per_page=20")
            run_id=$(python3 -c 'import json,sys,datetime; p=json.load(sys.stdin); started=datetime.datetime.fromisoformat(sys.argv[1].replace("Z","+00:00")); print(next((str(r["id"]) for r in p.get("workflow_runs",[]) if datetime.datetime.fromisoformat(r["created_at"].replace("Z","+00:00")) >= started), ""))' "$started" <<<"$runs")
            [ -n "$run_id" ] && break
            sleep 5
          done
          [ -n "$run_id" ] || { echo 'Could not find dispatched run'; exit 1; }
          echo "Dispatched run $run_id"

          conclusion=''
          status=''
          for attempt in $(seq 1 300); do
            run=$(curl --fail-with-body -sS -L "${auth[@]}" "$api/actions/runs/$run_id")
            read -r status conclusion < <(python3 -c 'import json,sys; r=json.load(sys.stdin); print(r.get("status", ""), r.get("conclusion") or "")' <<<"$run")
            echo "status=$status conclusion=$conclusion"
            [ "$status" = 'completed' ] && break
            sleep 10
          done

          result=.github/oculus-16unit-results
          rm -rf "$result"
          mkdir -p "$result"
          printf 'run_id=%s\nstatus=%s\nconclusion=%s\n' "$run_id" "$status" "$conclusion" > "$result/status.txt"

          artifacts=$(curl --fail-with-body -sS -L "${auth[@]}" "$api/actions/runs/$run_id/artifacts")
          artifact_url=$(python3 -c 'import json,sys; p=json.load(sys.stdin); a=next((x for x in p.get("artifacts",[]) if x["name"]=="Oculus-1.12.2-apple-16unit-fixed"), None); print(a["archive_download_url"] if a else "")' <<<"$artifacts")
          if [ -n "$artifact_url" ]; then
            curl --fail-with-body -sS -L "${auth[@]}" "$artifact_url" -o "$result/artifact.zip"
            unzip -q "$result/artifact.zip" -d "$result/extracted"
            rm "$result/artifact.zip"
            jar_path=$(find "$result/extracted" -type f -name 'oculus-0.1.0.jar' | head -n 1 || true)
            [ -z "$jar_path" ] || cp "$jar_path" "$result/oculus-0.1.0-apple-16unit-fixed.jar"
            image_path=$(find "$result/extracted" -type f -name 'center-depth-16unit.png' | head -n 1 || true)
            [ -z "$image_path" ] || cp "$image_path" "$result/center-depth-16unit.png"
            log_path=$(find "$result/extracted" -type f -name 'latest.log' | head -n 1 || true)
            [ -z "$log_path" ] || cp "$log_path" "$result/latest.log"
            [ ! -f "$result/oculus-0.1.0-apple-16unit-fixed.jar" ] || sha256sum "$result/oculus-0.1.0-apple-16unit-fixed.jar" > "$result/sha256.txt"
          else
            printf 'No validation artifact found.\n' > "$result/no-artifact.txt"
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$result"
          git commit -m "ci: collect Oculus 16-unit result $run_id" || true
          git push origin HEAD:1.16.X-dev

          [ "$status" = 'completed' ]
          [ "$conclusion" = 'success' ]
